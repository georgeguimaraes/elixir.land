name: Correct a listing
description: Report wrong data for a company on Elixir Land.
title: "Correct listing: "
body:
  - type: markdown
    attributes:
      value: |
        The Elixir team size and "In use now" come from LinkedIn. We count a person when Elixir is on their job at the company.

        **What counts on LinkedIn.** Elixir must be on the job at your company, in one of these places:
        - A skill linked to the job. Edit the job on your profile, go to **Skills** and add **Elixir**. Or, in the **Skills** section of your profile, edit Elixir and select the job.
        - The job title, for example "Elixir Engineer".
        - The job description.

        Elixir in the headline, in the "About" section or as a skill that is not linked to a job does not count. To fix a team size, ask your team to do this first. Then send this issue, and we will scan again.

        This issue is public. Do not add names or links to personal profiles.
  - type: input
    id: company
    attributes:
      label: Company
      description: The company name as Elixir Land shows it.
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: What is wrong
      options:
        - Headquarters or country
        - Sector
        - Company size
        - Elixir team size
        - In use now or last use
        - Website
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Tell us the correct value. A link to a public company page helps.
  - type: checkboxes
    id: linkedin-jobs
    attributes:
      label: Check
      description: Only for a team size or "In use now" correction.
      options:
        - label: Our team has Elixir on their current job at this company on LinkedIn (a skill linked to the job, the job title or the job description).
