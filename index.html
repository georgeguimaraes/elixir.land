<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elixir.land</title>
  <meta name="description" content="where Elixir meets Brazil">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --elixir: #4b275f;
      --elixir-light: #7a4a94;
      --elixir-glow: #b589c4;
      --elixir-deep: #2e1640;
      --ocean: #1f4d77;
      --ocean-light: #3a7aa8;
      --ocean-deep: #0f2a47;
      --land: #5ca65c;
      --land-dark: #2f6e2f;
      --brazil: #8dd18d;
      --brazil-dark: #4d8f4d;
      --star: #ffffff;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background:
        radial-gradient(ellipse at 50% 40%, #1b1038 0%, #0a0418 60%, #020108 100%);
      color: #fff;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    /* starfield */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 20% 30%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 75% 15%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 40% 80%, #fff 50%, transparent 100%),
        radial-gradient(2px 2px at 85% 70%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 10% 60%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 55% 45%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 30% 10%, #fff 50%, transparent 100%),
        radial-gradient(2px 2px at 65% 90%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 5% 90%, #fff 50%, transparent 100%);
      opacity: 0.6;
      animation: twinkle 6s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    .brand {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      letter-spacing: 0.5em;
      text-transform: lowercase;
      opacity: 0;
      animation: fade-in 1.5s ease-out 0.2s forwards;
      z-index: 10;
    }

    .tagline {
      position: fixed;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-align: center;
      opacity: 0;
      animation: fade-in 2s ease-out 10s forwards;
      color: #d9c9e8;
      z-index: 10;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .scene {
      position: relative;
      width: 520px;
      height: 520px;
      animation: scene-zoom 12s cubic-bezier(0.4, 0, 0.3, 1) forwards;
    }

    @keyframes scene-zoom {
      0%, 50% { transform: scale(1) translateY(0); }
      65% { transform: scale(1.4) translateY(40px); }
      100% { transform: scale(1.4) translateY(40px); }
    }

    /* globe */
    .globe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 440px;
      height: 440px;
      margin-left: -220px;
      margin-top: -220px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--ocean);
      box-shadow:
        inset -25px -35px 80px rgba(0, 0, 0, 0.55),
        inset 25px 25px 60px rgba(255, 255, 255, 0.08),
        0 0 60px rgba(120, 180, 220, 0.25),
        0 0 140px rgba(75, 39, 95, 0.35);
    }

    .map-track {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 2640px;
      display: flex;
      animation: spin 6s cubic-bezier(0.18, 0.7, 0.25, 1) forwards;
    }

    .map {
      width: 880px;
      height: 100%;
      flex: 0 0 auto;
      display: block;
    }

    /* 2 full rotations (1760) then land so Brazil is centered.
       Brazil center in one copy ≈ x 275. Globe internal center ≈ 220.
       Final offset per copy = 220 - 275 = -55. So -(1760 + 55) = -1815. */
    @keyframes spin {
      0%   { transform: translateX(0); }
      60%  { transform: translateX(-1500px); }
      100% { transform: translateX(-1815px); }
    }

    /* spherical shading on top of map */
    .shade {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 38%),
        radial-gradient(circle at 70% 72%, rgba(0, 0, 0, 0.55) 15%, rgba(0, 0, 0, 0) 65%);
      mix-blend-mode: normal;
    }

    /* soft atmosphere halo */
    .atmosphere {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 500px;
      height: 500px;
      margin-left: -250px;
      margin-top: -250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(122, 74, 148, 0) 60%, rgba(122, 74, 148, 0.35) 72%, rgba(122, 74, 148, 0) 82%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: translate(0, 0) scale(1); }
      50% { opacity: 1; transform: translate(0, 0) scale(1.03); }
    }

    /* pulse under brazil when it lands */
    .brazil-pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      margin-left: -35px;
      margin-top: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(181, 137, 196, 0.9) 0%, rgba(181, 137, 196, 0) 70%);
      opacity: 0;
      animation: brazil-pulse 2s ease-out 5s forwards, brazil-pulse-loop 2.5s ease-in-out 7s infinite;
      pointer-events: none;
    }
    @keyframes brazil-pulse {
      0%   { opacity: 0; transform: scale(0.3); }
      60%  { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.85; transform: scale(1); }
    }
    @keyframes brazil-pulse-loop {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.25); }
    }

    /* flag: pole + logo */
    .flag-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: -140px;
      margin-top: -20px;
      width: 280px;
      height: 0;
      pointer-events: none;
      z-index: 5;
    }

    .pole {
      position: absolute;
      left: 50%;
      top: 0;
      width: 3px;
      height: 0;
      margin-left: -1.5px;
      background: linear-gradient(to top, rgba(181, 137, 196, 1), rgba(255, 255, 255, 0.9));
      border-radius: 3px;
      box-shadow: 0 0 12px rgba(181, 137, 196, 0.9);
      transform-origin: bottom center;
      animation: pole-rise 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) 7.8s forwards;
    }
    @keyframes pole-rise {
      0%   { height: 0; top: 0; }
      100% { height: 260px; top: -260px; }
    }

    .logo {
      position: absolute;
      left: 50%;
      top: 0;
      width: 240px;
      height: 320px;
      margin-left: -120px;
      margin-top: -320px;
      transform: translateY(40px) scale(0.1) rotate(-6deg);
      opacity: 0;
      transform-origin: center bottom;
      filter: drop-shadow(0 10px 30px rgba(75, 39, 95, 0.9));
      animation:
        logo-unfurl 1.6s cubic-bezier(0.25, 1.4, 0.4, 1) 8.6s forwards,
        logo-float 4s ease-in-out 10.5s infinite;
    }
    @keyframes logo-unfurl {
      0%   { opacity: 0; transform: translateY(40px) scale(0.1) rotate(-6deg); }
      60%  { opacity: 1; transform: translateY(-10px) scale(1.1) rotate(3deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }
    @keyframes logo-float {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-8px) rotate(1.5deg); }
    }

    /* sparkle dots at flag */
    .sparkle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px #fff, 0 0 18px var(--elixir-glow);
      opacity: 0;
      animation: sparkle 3s ease-out 9s infinite;
    }
    .sparkle.s2 { animation-delay: 9.4s; margin-top: -80px; margin-left: 40px; }
    .sparkle.s3 { animation-delay: 9.8s; margin-top: -140px; margin-left: -60px; }
    .sparkle.s4 { animation-delay: 10.2s; margin-top: -100px; margin-left: 80px; }
    .sparkle.s5 { animation-delay: 10.6s; margin-top: -180px; margin-left: -30px; }

    @keyframes sparkle {
      0%   { opacity: 0; transform: scale(0.2) translateY(0); }
      30%  { opacity: 1; transform: scale(1) translateY(-20px); }
      100% { opacity: 0; transform: scale(0.3) translateY(-80px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; }
    }

    @media (max-width: 600px) {
      .scene { transform: scale(0.75); }
      .tagline { font-size: 0.85rem; padding: 0 1rem; }
    }
  </style>
</head>
